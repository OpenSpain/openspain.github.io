<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>OpenSpain — Qué queremos cambiar (vídeo horizontal)</title>
  <link rel="stylesheet" href="../brand.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body { background: var(--brand-blue); color: var(--brand-paper); font-family: var(--brand-font); }
    #stage { position: relative; width: 100%; height: 100%; padding: 82px 120px; }
    .logo { display: flex; align-items: center; gap: 18px; width: max-content; font-size: 58px; font-weight: 800; letter-spacing: -2px; }
    .logo img { width: 70px; height: 70px; filter: brightness(0) invert(1); }
    .eyebrow { margin: 62px 0 26px; font-size: 27px; letter-spacing: 3px; font-weight: 700; }
    #copy { width: 1430px; }
    h1 { font-size: 100px; line-height: 1.08; letter-spacing: -4px; margin: 0; font-weight: 800; }
    p { font-size: 46px; line-height: 1.45; max-width: 1380px; margin: 34px 0 0; color: var(--brand-light); }
    #number { position: absolute; top: 80px; right: 120px; font-size: 96px; font-weight: 800; letter-spacing: -5px; }
    .footer { position: absolute; bottom: 66px; left: 120px; right: 120px; display: flex; justify-content: space-between; border-top: 2px solid #ffffff55; padding-top: 22px; font-size: 25px; color: var(--brand-light); }
    #progress { position: absolute; bottom: 0; left: 0; height: 8px; background: #ffffff; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="logo"><img src="../favicon.svg" alt="">openspain.</div>
    <span id="number"></span>
    <div id="copy">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p id="description"></p>
    </div>
    <div class="footer"><span>PROPUESTAS, NO REFORMAS APROBADAS</span><span>openspain.org ↗</span></div>
    <div id="progress"></div>
  </div>
  <script>
    let messages;
    window.DURATION = 60;
    window.initialize = async data => {
      messages = data;
      await document.fonts.ready;
      await document.querySelector('.logo img').decode();
      window.render(0);
    };
    window.render = time => {
      if (!messages) throw new Error('Falta el guion del programa.');
      let title, description, eyebrow, number = '';
      const index = time < 4 ? -1 : Math.min(messages.length, Math.floor((time - 4) / 6));
      if (index === -1) {
        eyebrow = 'UN PROGRAMA CIUDADANO INDEPENDIENTE';
        title = 'Abrir España. Ampliar oportunidades.';
        description = '';
      } else if (index === messages.length) {
        eyebrow = 'ABIERTO A PERSONAS, IDEAS Y PROPUESTAS';
        title = 'Tu experiencia también cuenta.';
        description = 'Conoce el programa y aporta tu idea en openspain.org.';
      } else {
        const message = messages[index];
        eyebrow = 'LO QUE PROPONEMOS';
        title = message.title;
        description = message.description;
        number = String(message.id).padStart(2, '0');
      }
      document.querySelector('#title').textContent = title;
      document.querySelector('#description').textContent = description;
      document.querySelector('#eyebrow').textContent = eyebrow;
      document.querySelector('#number').textContent = number;
      const start = index === -1 ? 0 : 4 + index * 6;
      const progress = Math.min(1, Math.max(0, (time - start) / 0.5));
      document.querySelector('#copy').style.transform = `translateY(${12 * (1 - progress)}px)`;
      document.querySelector('#copy').style.opacity = 0.5 + 0.5 * progress;
      document.querySelector('#progress').style.width = `${Math.min(100, time / window.DURATION * 100)}%`;
    };
  </script>
</body>
</html>
