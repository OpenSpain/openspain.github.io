name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check programme
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp .nojekyll index.html styles.css app.js program.js charts.js \
            favicon.svg bandera.svg openspain-logo.svg openspain-logo.png PROGRAMA.md \
            informe.html informe.css informe.js \
            OpenSpain-Programa.pdf OpenSpain-Presentacion.pdf _site/
          mkdir _site/video
          cp video/OpenSpain-Hazte-Simpatizante.mp4 video/hazte-simpatizante-portada.jpg \
            video/hazte-simpatizante-es.vtt _site/video/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
